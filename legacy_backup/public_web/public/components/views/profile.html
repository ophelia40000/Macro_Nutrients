<div id="view-profile" class="view">
    <header class="app-header" style="background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
        <button class="back-btn" id="btn-back-profile" style="background:none; border:none; color:var(--text-main); cursor:pointer; padding: 10px;">
            <i data-lucide="arrow-left"></i>
        </button>
        <h1 class="app-title" style="font-size: 20px;">Profile</h1>
        <div style="width: 44px;"></div> <!-- Spacer -->
    </header>
    
    <main class="content-scrollable" style="padding: 24px; padding-top: 100px;">
        <!-- Avatar Section -->
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; margin-top: 10px;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-lime), #8fd128); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(187, 242, 70, 0.2); margin-bottom: 16px;">
                <i data-lucide="user" style="width: 48px; height: 48px; color: #121212;"></i>
            </div>
            <h2 style="color: var(--text-main); font-size: 22px; font-weight: 700; margin: 0;">My Body Stats</h2>
            <p style="color: var(--text-dim); font-size: 14px; margin-top: 4px;">Track your physical metrics</p>
        </div>
        
        <!-- Metrics Card -->
        <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 24px; margin-bottom: 24px;">
            <div style="display: flex; gap: 16px; margin-bottom: 24px;">
                <div style="flex: 1;">
                    <label style="display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Height</label>
                    <div class="input-group" style="margin-bottom: 0; background: rgba(0,0,0,0.2);">
                        <i data-lucide="ruler" style="color: var(--accent-lime);"></i>
                        <input type="number" id="input-profile-height" placeholder="0" style="font-size: 18px; font-weight: 600;">
                        <span style="color: var(--text-dim); padding-right: 15px; font-weight: 600;">cm</span>
                    </div>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Weight</label>
                    <div class="input-group" style="margin-bottom: 0; background: rgba(0,0,0,0.2);">
                        <i data-lucide="scale" style="color: var(--accent-lime);"></i>
                        <input type="number" step="0.1" id="input-profile-weight" placeholder="0" style="font-size: 18px; font-weight: 600;">
                        <span style="color: var(--text-dim); padding-right: 15px; font-weight: 600;">kg</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Body Fat Calculator Card -->
        <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 24px; margin-bottom: 32px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--text-main); font-size: 18px; font-weight: 700; margin: 0;">Body Fat % (US Navy)</h3>
                <div id="display-body-fat" style="font-size: 24px; font-weight: 900; color: var(--accent-lime);">--%</div>
            </div>
            
            <div style="margin-bottom: 16px;">
                <label style="display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Gender</label>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-gender active" id="btn-gender-male" style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--accent-lime); background: rgba(187, 242, 70, 0.1); color: var(--accent-lime); font-weight: 600; cursor: pointer;">Male</button>
                    <button class="btn-gender" id="btn-gender-female" style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: var(--text-dim); font-weight: 600; cursor: pointer;">Female</button>
                </div>
            </div>

            <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                <div style="flex: 1;">
                    <label style="display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Neck</label>
                    <div class="input-group" style="margin-bottom: 0; background: rgba(0,0,0,0.2);">
                        <input type="number" step="0.1" id="input-profile-neck" placeholder="0" style="padding-left: 15px; font-size: 16px; font-weight: 600;">
                        <span style="color: var(--text-dim); padding-right: 15px; font-weight: 600;">cm</span>
                    </div>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Waist</label>
                    <div class="input-group" style="margin-bottom: 0; background: rgba(0,0,0,0.2);">
                        <input type="number" step="0.1" id="input-profile-waist" placeholder="0" style="padding-left: 15px; font-size: 16px; font-weight: 600;">
                        <span style="color: var(--text-dim); padding-right: 15px; font-weight: 600;">cm</span>
                    </div>
                </div>
            </div>
            
            <div id="hip-container" style="display: none; margin-bottom: 16px;">
                <label style="display: block; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Hip (at widest)</label>
                <div class="input-group" style="margin-bottom: 0; background: rgba(0,0,0,0.2);">
                    <input type="number" step="0.1" id="input-profile-hip" placeholder="0" style="padding-left: 15px; font-size: 16px; font-weight: 600;">
                    <span style="color: var(--text-dim); padding-right: 15px; font-weight: 600;">cm</span>
                </div>
            </div>
        </div>

        <button class="btn-primary" id="btn-save-profile" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;">
            <i data-lucide="check" style="width: 20px; height: 20px;"></i>
            Save Changes
        </button>
    </main>
</div>
